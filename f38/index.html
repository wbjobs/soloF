<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPH Fluid Simulation - WebGPU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 12px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
    }
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-size: 12px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 5px;
      min-width: 200px;
    }
    .control-group {
      margin-bottom: 10px;
    }
    .control-group label {
      display: block;
      margin-bottom: 5px;
    }
    .control-group input[type="range"] {
      width: 100%;
    }
    .control-value {
      color: #4fc3f7;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="info">
    WebGPU SPH Fluid Simulation<br>
    Drag mouse to apply force<br>
    Particles: <span id="particleCount">0</span>
  </div>
  <div id="controls">
    <div class="control-group">
      <label>Viscosity: <span id="viscosityValue" class="control-value">100</span></label>
      <input type="range" id="viscositySlider" min="0" max="500" value="100" step="1">
    </div>
    <div class="control-group">
      <label>Rest Density: <span id="densityValue" class="control-value">1000</span></label>
      <input type="range" id="densitySlider" min="500" max="2000" value="1000" step="10">
    </div>
    <div class="control-group">
      <label>Gas Stiffness: <span id="gasValue" class="control-value">2000</span></label>
      <input type="range" id="gasSlider" min="500" max="5000" value="2000" step="50">
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
