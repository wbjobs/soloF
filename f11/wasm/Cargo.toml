[package]
name = "matrix_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.89"
nalgebra = { version = "0.32.3", features = ["std"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"

[profile.release]
opt-level = 3
lto = true
