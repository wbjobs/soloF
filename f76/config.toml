[mqtt]
broker = "localhost"
port = 1883
client_id = "mqtt-bridge-client"
username = ""
password = ""
topics = ["iot/+/sensor", "iot/device/#"]
keep_alive = 60

[http]
api_url = "https://api.example.com/iot/data"
timeout_secs = 10
headers = { "Content-Type" = "application/json", "Authorization" = "Bearer your-token-here" }

[metrics]
enabled = true
host = "0.0.0.0"
port = 9090
endpoint = "/metrics"

[[rules]]
name = "high-temperature"
field = "temperature"
operator = "gt"
value = 30.0

[[rules]]
name = "low-humidity"
field = "humidity"
operator = "lt"
value = 20.0

[[rules]]
name = "pressure-warning"
field = "pressure"
operator = "gt"
value = 1050.0
