<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 3D 路径追踪预览</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <canvas id="canvas"></canvas>
    <div class="controls">
      <h2>材质控制</h2>
      <div class="control-group">
        <label>球体反射率: <span id="sphereReflectivityValue">0.5</span></label>
        <input type="range" id="sphereReflectivity" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="control-group">
        <label>球体粗糙度: <span id="sphereRoughnessValue">0.3</span></label>
        <input type="range" id="sphereRoughness" min="0" max="1" step="0.01" value="0.3">
      </div>
      <div class="control-group">
        <label>平面反射率: <span id="planeReflectivityValue">0.3</span></label>
        <input type="range" id="planeReflectivity" min="0" max="1" step="0.01" value="0.3">
      </div>
      <div class="control-group">
        <label>平面粗糙度: <span id="planeRoughnessValue">0.8</span></label>
        <input type="range" id="planeRoughness" min="0" max="1" step="0.01" value="0.8">
      </div>
      <div class="control-group">
        <label>热力图强度: <span id="heatmapIntensityValue">1.0</span></label>
        <input type="range" id="heatmapIntensity" min="0" max="3" step="0.1" value="1.0">
      </div>
      <div class="control-group checkbox">
        <label><input type="checkbox" id="showHeatmap" checked> 显示热力图</label>
      </div>
      <div class="control-group">
        <label>反弹次数: <span id="bounceValue">0</span> 次</label>
        <input type="range" id="bounceSlider" min="0" max="2" step="1" value="0">
        <div class="bounce-labels">
          <span>0次</span>
          <span>1次</span>
          <span>2次</span>
        </div>
      </div>
      <button id="calculateBtn">计算路径追踪</button>
      <button id="exportBtn" class="export-btn">导出 PNG</button>
      <div class="status" id="status">就绪</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
