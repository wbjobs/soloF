<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 文件直传</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .role-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .role-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .role-btn:hover, .role-btn.active {
            background: #667eea;
            color: white;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        .room-info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .room-id {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 5px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .file-upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .file-upload-area:hover {
            background: #f0f4ff;
        }
        .file-upload-area.dragover {
            background: #e0e8ff;
            border-color: #764ba2;
        }
        .file-upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        #fileInput {
            display: none;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .progress-container {
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .file-info {
            margin-top: 10px;
            text-align: center;
            color: #666;
        }
        .speed-info {
            margin-top: 5px;
            text-align: center;
            color: #666;
            font-weight: 500;
        }
        .resume-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .resume-dialog-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            text-align: center;
        }
        .resume-dialog h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .resume-dialog p {
            margin-bottom: 20px;
            color: #666;
        }
        .resume-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .resume-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .resume-btn.primary {
            background: #667eea;
            color: white;
        }
        .resume-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 P2P 文件直传</h1>
        
        <div class="role-selector">
            <button class="role-btn active" data-role="sender">📤 发送文件</button>
            <button class="role-btn" data-role="receiver">📥 接收文件</button>
        </div>

        <div id="senderPanel" class="panel active">
            <button class="btn" id="createRoomBtn">创建房间</button>
            
            <div id="roomInfo" class="room-info hidden">
                <p>房间号（分享给接收方）：</p>
                <div class="room-id" id="roomIdDisplay"></div>
                <button class="copy-btn" id="copyBtn">复制</button>
            </div>

            <div id="waitingStatus" class="status waiting hidden">
                等待接收方连接...
            </div>

            <div id="fileUploadArea" class="file-upload-area hidden">
                <div class="file-upload-icon">📄</div>
                <p>点击或拖拽文件到此处</p>
                <input type="file" id="fileInput">
            </div>

            <div id="senderProgress" class="progress-container hidden">
                <div class="progress-bar">
                    <div class="progress-fill" id="senderProgressFill" style="width: 0%">0%</div>
                </div>
                <div class="file-info" id="senderFileInfo"></div>
                <div class="speed-info" id="senderSpeedInfo"></div>
            </div>
        </div>

        <div id="receiverPanel" class="panel">
            <div class="input-group">
                <label>输入房间号：</label>
                <input type="text" id="roomIdInput" maxlength="6" placeholder="例如：ABC123">
            </div>
            <button class="btn" id="joinRoomBtn">加入房间</button>

            <div id="receiverStatus" class="status hidden"></div>

            <div id="receiverProgress" class="progress-container hidden">
                <div class="progress-bar">
                    <div class="progress-fill" id="receiverProgressFill" style="width: 0%">0%</div>
                </div>
                <div class="file-info" id="receiverFileInfo"></div>
                <div class="speed-info" id="receiverSpeedInfo"></div>
            </div>
        </div>
    </div>

    <div id="resumeDialog" class="resume-dialog hidden">
        <div class="resume-dialog-content">
            <h3>🔄 发现未完成的传输</h3>
            <p id="resumeFileInfo"></p>
            <p id="resumeProgress"></p>
            <div class="resume-buttons">
                <button class="resume-btn secondary" id="restartBtn">重新开始</button>
                <button class="resume-btn primary" id="resumeBtn">继续传输</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
