<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答系统 - 引用溯源演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .input-section {
            grid-column: 1 / -1;
        }
        
        .query-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .answer-content {
            line-height: 1.8;
            color: #333;
            font-size: 15px;
        }
        
        .citation-link {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            margin: 0 2px;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .citation-link:hover {
            background: #ffeaa7;
            transform: scale(1.1);
        }
        
        .citation-link.active {
            background: #ffc107;
            color: #333;
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.3);
        }
        
        .citation-item {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            transition: all 0.3s;
        }
        
        .citation-item.highlighted {
            background: #ffecb5;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.2);
        }
        
        .citation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .citation-id {
            background: #ffc107;
            color: #333;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        
        .citation-page {
            font-size: 13px;
            color: #666;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        .citation-text {
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.7;
            color: #444;
            border: 1px dashed #ddd;
        }
        
        .citation-source {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }
        
        .stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }
        
        .file-upload-section {
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .file-label:hover {
            background: #218838;
        }
        
        .upload-status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 RAG 智能问答系统</h1>
            <p>基于检索增强生成的智能问答，支持 PDF 文档引用溯源与原文高亮</p>
        </div>
        
        <div class="main-content">
            <div class="card input-section">
                <h2>📤 上传文档 & 提问</h2>
                <div class="file-upload-section">
                    <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    <label for="fileInput" class="file-label">📄 上传 PDF 文档</label>
                    <div id="uploadStatus" class="upload-status"></div>
                </div>
                
                <input type="text" id="questionInput" class="query-input" placeholder="请输入您的问题，例如：如何配置网络？">
                <button id="submitBtn" class="submit-btn">🔍 开始查询</button>
            </div>
            
            <div class="card">
                <h2>💡 智能回答</h2>
                <div id="answerSection">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <p>输入问题后，AI 将基于文档内容回答您</p>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>📚 引用溯源 (点击 [n] 高亮对应原文)</h2>
                <div id="citationsSection">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/>
                        </svg>
                        <p>回答中的引用来源将显示在这里</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let activeCitation = null;
        
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const statusEl = document.getElementById('uploadStatus');
            statusEl.textContent = '正在上传...';
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch(`${API_BASE}/ingest`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusEl.textContent = `✅ 上传成功！已处理 ${result.total_chunks} 个文档片段`;
                    statusEl.style.color = '#28a745';
                } else {
                    statusEl.textContent = `❌ 上传失败: ${result.message}`;
                    statusEl.style.color = '#dc3545';
                }
            } catch (error) {
                statusEl.textContent = `❌ 上传失败: ${error.message}`;
                statusEl.style.color = '#dc3545';
            }
        });
        
        document.getElementById('submitBtn').addEventListener('click', submitQuery);
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitQuery();
        });
        
        async function submitQuery() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) {
                alert('请输入问题');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            const answerSection = document.getElementById('answerSection');
            const citationsSection = document.getElementById('citationsSection');
            
            btn.disabled = true;
            btn.textContent = '🔄 查询中...';
            
            answerSection.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在检索文档并生成回答...</p>
                </div>
            `;
            citationsSection.innerHTML = `
                <div class="loading">
                    <p>正在提取引用来源...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        use_mock_llm: true,
                        use_rerank: true,
                        top_k: 4
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    renderAnswer(result);
                    renderCitations(result);
                } else {
                    answerSection.innerHTML = `<p style="color: #dc3545;">错误: ${result.error}</p>`;
                    citationsSection.innerHTML = '';
                }
            } catch (error) {
                answerSection.innerHTML = `<p style="color: #dc3545;">请求失败: ${error.message}</p>`;
                citationsSection.innerHTML = '';
            }
            
            btn.disabled = false;
            btn.textContent = '🔍 开始查询';
        }
        
        function renderAnswer(result) {
            const answerSection = document.getElementById('answerSection');
            
            let answerHtml = result.answer;
            answerHtml = answerHtml.replace(/\[(\d+)\]/g, (match, num) => {
                return `<span class="citation-link" data-citation="${num}" onclick="highlightCitation(${num})">[${num}]</span>`;
            });
            
            answerSection.innerHTML = `
                <div class="stats">
                    <div class="stat-item">📄 检索文档: <span class="stat-value">${result.doc_count}</span></div>
                    <div class="stat-item">📌 引用数量: <span class="stat-value">${result.citation_count}</span></div>
                    <div class="stat-item">🔄 重排序: <span class="stat-value">${result.use_rerank ? '已启用' : '未启用'}</span></div>
                </div>
                <div class="answer-content">${answerHtml}</div>
            `;
        }
        
        function renderCitations(result) {
            const citationsSection = document.getElementById('citationsSection');
            
            if (result.citations.length === 0) {
                citationsSection.innerHTML = `
                    <div class="empty-state">
                        <p>暂无引用来源</p>
                    </div>
                `;
                return;
            }
            
            let citationsHtml = result.citations.map(cite => `
                <div class="citation-item" id="citation-${cite.citation_id}" data-citation-id="${cite.citation_id}">
                    <div class="citation-header">
                        <span class="citation-id">${cite.citation_id}</span>
                        <span class="citation-page">📄 第 ${cite.page} 页</span>
                    </div>
                    <div class="citation-text">${cite.highlight_text}</div>
                    <div class="citation-source">来源: ${cite.source || '未知文档'}</div>
                </div>
            `).join('');
            
            citationsSection.innerHTML = citationsHtml;
        }
        
        function highlightCitation(num) {
            document.querySelectorAll('.citation-link').forEach(el => {
                el.classList.remove('active');
            });
            
            document.querySelectorAll('.citation-item').forEach(el => {
                el.classList.remove('highlighted');
            });
            
            const linkEl = document.querySelector(`.citation-link[data-citation="${num}"]`);
            const citeEl = document.getElementById(`citation-${num}`);
            
            if (linkEl) linkEl.classList.add('active');
            if (citeEl) {
                citeEl.classList.add('highlighted');
                citeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
