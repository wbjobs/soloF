[build-system]
requires = ["hatchling>=1.5.0", "hatch-jupyter-builder>=0.8.1"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-netcdf-viewer"
version = "0.1.0"
description = "JupyterLab extension for viewing NetCDF meteorological data"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name="Your Name", email="your.email@example.com" }
]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "jupyter_server>=2.0.0",
  "netCDF4>=1.6.0",
  "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/your-username/jupyterlab-netcdf-viewer"
BugTracker = "https://github.com/your-username/jupyterlab-netcdf-viewer/issues"
Source = "https://github.com/your-username/jupyterlab-netcdf-viewer"

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_netcdf_viewer"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.8.1"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "jupyterlab_netcdf_viewer/labextension/static/style.js",
]
npm-build-command = "build:prod"

[tool.hatch.metadata.hooks.custom]
