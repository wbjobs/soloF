[package]
name = "parquet-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
parquet = "52.0"
arrow = "52.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.arrow-json]
version = "52.0"
