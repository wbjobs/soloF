<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时序数据异常检测 - 实时监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        button.warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
        }

        .connection-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .connected {
            background: #48bb78;
            color: white;
        }

        .disconnected {
            background: #f56565;
            color: white;
        }

        .anomaly-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .anomaly-item {
            background: #fff5f5;
            border-left: 4px solid #f56565;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .anomaly-metric {
            font-weight: 600;
            color: #c53030;
            font-size: 1.1em;
        }

        .anomaly-method {
            display: inline-block;
            background: #fed7d7;
            color: #c53030;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin: 5px 5px 5px 0;
        }

        .anomaly-method.adaptive {
            background: #c6f6d5;
            color: #276749;
        }

        .anomaly-confidence {
            display: inline-block;
            background: #f6e05e;
            color: #744210;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin: 5px 0;
        }

        .anomaly-time {
            color: #718096;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .result-area {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .result-area pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            color: #4a5568;
        }

        .baseline-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .period-card {
            background: #f7fafc;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85em;
        }

        .period-title {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }

        .stat-label {
            color: #718096;
        }

        .stat-value {
            font-weight: 600;
            color: #2d3748;
        }

        .threshold-range {
            background: linear-gradient(90deg, #68d391, #f6e05e, #fc8181);
            height: 8px;
            border-radius: 4px;
            margin: 8px 0;
            position: relative;
        }

        .threshold-marker {
            position: absolute;
            width: 2px;
            height: 16px;
            background: #667eea;
            top: -4px;
        }

        .current-period {
            background: #ebf8ff;
            border: 2px solid #4299e1;
        }

        .sigma-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sigma-control input[type="range"] {
            flex: 1;
        }

        .sigma-value {
            font-weight: 600;
            color: #667eea;
            min-width: 40px;
        }

        .info-badge {
            display: inline-block;
            background: #e9d8fd;
            color: #553c9a;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 8px;
        }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 时序数据异常检测服务</h1>

        <div class="grid">
            <div class="card">
                <h2>📤 发送传感器数据</h2>
                <div class="form-group">
                    <label>设备ID</label>
                    <input type="text" id="deviceId" value="device-001">
                </div>
                <div class="form-group">
                    <label>温度 (°C)</label>
                    <input type="number" id="temperature" value="25.5" step="0.1">
                </div>
                <div class="form-group">
                    <label>振动 (mm/s)</label>
                    <input type="number" id="vibration" value="2.3" step="0.1">
                </div>
                <div class="form-group">
                    <label>电流 (A)</label>
                    <input type="number" id="current" value="5.2" step="0.1">
                </div>
                <button onclick="sendSensorData()">发送数据</button>
                <button class="danger" onclick="sendAnomalyData()">发送异常值</button>
                <div class="result-area" id="sendResult"></div>
            </div>

            <div class="card">
                <h2>📊 历史数据回测</h2>
                <div class="form-group">
                    <label>设备ID</label>
                    <input type="text" id="backtestDeviceId" value="device-001">
                </div>
                <div class="form-group">
                    <label>开始时间</label>
                    <input type="datetime-local" id="startTime">
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" id="endTime">
                </div>
                <div class="form-group">
                    <label>指标 (可选)</label>
                    <input type="text" id="metric" placeholder="temperature, vibration, current">
                </div>
                <button onclick="runBacktest()">运行回测</button>
                <div class="backtest-result" id="backtestResult"></div>
            </div>

            <div class="card">
                <h2>🎯 自适应阈值管理 <span class="info-badge">NEW</span></h2>
                <div class="form-group">
                    <label>设备ID</label>
                    <input type="text" id="baselineDeviceId" value="device-001">
                </div>
                <div class="form-group">
                    <label>灵敏度调节 (Sigma)</label>
                    <div class="sigma-control">
                        <input type="range" id="sigmaRange" min="0.5" max="5" step="0.1" value="2.5" onchange="updateSigmaDisplay()">
                        <span class="sigma-value" id="sigmaValue">2.5σ</span>
                    </div>
                </div>
                <button class="secondary" onclick="getBaseline()">查询基线</button>
                <button class="warning" onclick="trainBaseline()">训练基线</button>
                <button onclick="setSigma()">应用设置</button>
                <div class="result-area" id="baselineResult"></div>
            </div>
        </div>

        <div class="card">
            <h2>📈 设备基线状态</h2>
            <div id="baselineStatus">
                <p style="color: #718096; text-align: center; padding: 20px;">点击"查询基线"查看设备状态...</p>
            </div>
        </div>

        <div class="card">
            <h2>⚠️ 实时异常警报</h2>
            <div class="connection-status" id="connectionStatus">连接中...</div>
            <div class="anomaly-list" id="anomalyList">
                <p style="color: #718096; text-align: center; padding: 20px;">等待异常数据...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        const WS_BASE = 'ws://localhost:8080/ws';

        let ws;
        let anomalyCount = 0;

        const PERIODS = ['Night(00-06)', 'Morning(06-12)', 'Afternoon(12-18)', 'Evening(18-24)'];
        const PERIOD_LABELS = {
            'Night(00-06)': '🌙 夜间',
            'Morning(06-12)': '🌅 早晨',
            'Afternoon(12-18)': '☀️ 下午',
            'Evening(18-24)': '🌆 晚上'
        };

        function init() {
            const now = new Date();
            const yesterday = new Date(now - 24 * 60 * 60 * 1000);
            document.getElementById('endTime').value = now.toISOString().slice(0, 16);
            document.getElementById('startTime').value = yesterday.toISOString().slice(0, 16);

            connectWebSocket();
        }

        function getCurrentPeriod() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 6) return PERIODS[0];
            if (hour >= 6 && hour < 12) return PERIODS[1];
            if (hour >= 12 && hour < 18) return PERIODS[2];
            return PERIODS[3];
        }

        function connectWebSocket() {
            const status = document.getElementById('connectionStatus');
            status.textContent = '连接中...';
            status.className = 'connection-status';

            try {
                ws = new WebSocket(WS_BASE);

                ws.onopen = function() {
                    status.textContent = '已连接';
                    status.className = 'connection-status connected';
                };

                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.type === 'anomaly') {
                        displayAnomaly(data);
                    }
                };

                ws.onclose = function() {
                    status.textContent = '已断开';
                    status.className = 'connection-status disconnected';
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    status.textContent = '连接错误';
                    status.className = 'connection-status disconnected';
                };
            } catch (e) {
                console.error('WebSocket connection failed:', e);
                status.textContent = '连接失败';
                status.className = 'connection-status disconnected';
            }
        }

        function updateSigmaDisplay() {
            const value = document.getElementById('sigmaRange').value;
            document.getElementById('sigmaValue').textContent = value + 'σ';
        }

        async function sendSensorData() {
            const data = {
                deviceId: document.getElementById('deviceId').value,
                temperature: parseFloat(document.getElementById('temperature').value),
                vibration: parseFloat(document.getElementById('vibration').value),
                current: parseFloat(document.getElementById('current').value)
            };

            try {
                const response = await fetch(`${API_BASE}/sensor/data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('sendResult').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('sendResult').innerHTML = '<pre>错误: ' + error.message + '</pre>';
            }
        }

        function sendAnomalyData() {
            document.getElementById('temperature').value = 150 + Math.random() * 50;
            document.getElementById('vibration').value = 50 + Math.random() * 20;
            document.getElementById('current').value = 50 + Math.random() * 30;
            sendSensorData();
        }

        async function runBacktest() {
            const data = {
                deviceId: document.getElementById('backtestDeviceId').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                metric: document.getElementById('metric').value || undefined
            };

            const resultDiv = document.getElementById('backtestResult');
            resultDiv.innerHTML = '<p style="color: #718096;">运行回测中...</p>';

            try {
                const response = await fetch(`${API_BASE}/backtest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                let html = `
                    <div style="background: #ebf8ff; border-left: 4px solid #4299e1; padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 15px;">
                        <div style="font-size: 2em; font-weight: bold; color: #2b6cb0;">发现 ${result.count || 0} 个异常点</div>
                        <div>设备: ${result.deviceId}</div>
                    </div>
                `;

                if (result.anomalies && result.anomalies.length > 0) {
                    result.anomalies.slice(0, 20).forEach(a => {
                        const isAdaptive = a.method === 'adaptive';
                        html += `
                            <div class="anomaly-item">
                                <div class="anomaly-metric">${a.metric}: ${a.value}</div>
                                <span class="anomaly-method ${isAdaptive ? 'adaptive' : ''}">${a.method}</span>
                                <span class="anomaly-confidence">置信度: ${a.confidence.toFixed(1)}%</span>
                                <div class="anomaly-time">${new Date(a.timestamp).toLocaleString()}</div>
                                <div style="color: #742a2a; margin-top: 5px;">${a.description}</div>
                            </div>
                        `;
                    });
                    if (result.anomalies.length > 20) {
                        html += `<p style="text-align: center; color: #718096; margin-top: 10px;">... 还有 ${result.anomalies.length - 20} 条异常记录</p>`;
                    }
                }

                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = '<p style="color: #c53030;">错误: ' + error.message + '</p>';
            }
        }

        async function getBaseline() {
            const deviceId = document.getElementById('baselineDeviceId').value;
            const resultDiv = document.getElementById('baselineResult');
            const statusDiv = document.getElementById('baselineStatus');

            try {
                const response = await fetch(`${API_BASE}/baseline?deviceId=${encodeURIComponent(deviceId)}`);
                const result = await response.json();
                resultDiv.innerHTML = '<pre>基线查询成功</pre>';
                displayBaselineStatus(result);
            } catch (error) {
                resultDiv.innerHTML = '<pre>错误: ' + error.message + '</pre>';
            }
        }

        function displayBaselineStatus(data) {
            const statusDiv = document.getElementById('baselineStatus');
            const currentPeriod = getCurrentPeriod();

            let html = `<div style="text-align: center; margin-bottom: 20px;">
                <strong>设备: ${data.deviceId}</strong> | 
                当前时段: <span style="color: #667eea; font-weight: 600;">${PERIOD_LABELS[currentPeriod]}</span>
            </div>`;

            const metrics = ['temperature', 'vibration', 'current'];
            const metricLabels = {
                'temperature': '🌡️ 温度 (°C)',
                'vibration': '📳 振动 (mm/s)',
                'current': '⚡ 电流 (A)'
            };

            html += '<div class="grid" style="grid-template-columns: repeat(3, 1fr);">';

            for (const metric of metrics) {
                html += '<div class="card" style="padding: 15px;">';
                html += `<h3 style="color: #4a5568; margin-bottom: 15px; font-size: 1em;">${metricLabels[metric]}</h3>`;
                html += '<div class="baseline-grid">';

                for (const period of PERIODS) {
                    const isCurrent = period === currentPeriod;
                    const baseline = data.metrics?.[metric]?.[period];

                    if (baseline) {
                        html += `
                            <div class="period-card ${isCurrent ? 'current-period' : ''}">
                                <div class="period-title">${PERIOD_LABELS[period]} ${isCurrent ? ' ⬅️ 当前' : ''}</div>
                                <div class="stat-row"><span class="stat-label">均值:</span><span class="stat-value">${baseline.mean?.toFixed(2) || '-'}</span></div>
                                <div class="stat-row"><span class="stat-label">标准差:</span><span class="stat-value">${baseline.stdDev?.toFixed(2) || '-'}</span></div>
                                <div class="threshold-range" title="阈值范围">
                                    <div style="position: absolute; left: 0; right: 0; top: -15px; font-size: 10px; display: flex; justify-content: space-between;">
                                        <span>${baseline.lowerThreshold?.toFixed(1) || '-'}</span>
                                        <span>${baseline.upperThreshold?.toFixed(1) || '-'}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                html += '</div></div>';
            }

            html += '</div>';
            statusDiv.innerHTML = html;
        }

        async function trainBaseline() {
            const deviceId = document.getElementById('baselineDeviceId').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const resultDiv = document.getElementById('baselineResult');

            resultDiv.innerHTML = '<p style="color: #718096;">正在训练基线...</p>';

            try {
                const response = await fetch(`${API_BASE}/baseline/train`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, startTime, endTime })
                });
                const result = await response.json();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';

                if (result.success) {
                    getBaseline();
                }
            } catch (error) {
                resultDiv.innerHTML = '<pre>错误: ' + error.message + '</pre>';
            }
        }

        async function setSigma() {
            const sigma = parseFloat(document.getElementById('sigmaRange').value);
            const resultDiv = document.getElementById('baselineResult');

            try {
                const response = await fetch(`${API_BASE}/baseline/sigma`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sigma })
                });
                const result = await response.json();
                resultDiv.innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                resultDiv.innerHTML = '<pre>错误: ' + error.message + '</pre>';
            }
        }

        function displayAnomaly(data) {
            anomalyCount++;
            const list = document.getElementById('anomalyList');

            if (anomalyCount === 1) {
                list.innerHTML = '';
            }

            const isAdaptive = data.method === 'adaptive';
            const item = document.createElement('div');
            item.className = 'anomaly-item';
            item.innerHTML = `
                <div class="anomaly-metric">${data.deviceId} - ${data.metric}: ${data.value}</div>
                <span class="anomaly-method ${isAdaptive ? 'adaptive' : ''}">${data.method}</span>
                <span class="anomaly-confidence">置信度: ${data.confidence.toFixed(1)}%</span>
                <div class="anomaly-time">${new Date(data.timestamp).toLocaleString()}</div>
                <div style="color: #742a2a; margin-top: 5px;">${data.message}</div>
            `;

            list.insertBefore(item, list.firstChild);
        }

        init();
    </script>
</body>
</html>
