version: '3.8'

services:
  neo4j:
    image: neo4j:5.12-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector-service:
    build:
      context: ./vector-service
      dockerfile: Dockerfile
    container_name: vector-service
    ports:
      - "8501:8501"
    environment:
      MODEL_NAME: all-MiniLM-L6-v2
      PORT: 8501
    volumes:
      - ./vector-service:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  graphql-server:
    build:
      context: ./graphql-server
      dockerfile: Dockerfile
    container_name: graphql-server
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      VECTOR_SERVICE_URL: http://vector-service:8501
    depends_on:
      neo4j:
        condition: service_healthy
      vector-service:
        condition: service_started
    volumes:
      - ./graphql-server:/app

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: crawler
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      CRAWLER_START_URL: https://pkg.go.dev/std
      CRAWLER_MAX_DEPTH: 3
      CRAWLER_CONCURRENCY: 5
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./crawler:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_GRAPHQL_URL: http://localhost:8080/query
    depends_on:
      - graphql-server
    volumes:
      - ./frontend:/app
      - /app/node_modules
