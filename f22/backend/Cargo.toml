[package]
name = "log-collector-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
actix-web = "4.0"
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
elasticsearch = "8.0"
reqwest = { version = "0.11", features = ["json"] }
url = "2.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.0"
lazy_static = "1.0"
