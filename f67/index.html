<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>神经网络可视化</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #e94560;
    }
    .subtitle {
      text-align: center;
      color: #a0a0a0;
      margin-bottom: 30px;
    }
    #visualization {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .neuron {
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .neuron:hover {
      filter: brightness(1.3);
    }
    .connection {
      stroke-linecap: round;
      transition: opacity 0.3s ease;
    }
    .layer-label {
      font-size: 14px;
      font-weight: bold;
      fill: #e94560;
      text-anchor: middle;
    }
    .neuron-label {
      font-size: 11px;
      fill: #fff;
      text-anchor: middle;
      pointer-events: none;
    }
    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      border: 1px solid #e94560;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .legend {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .legend h3 {
      margin: 0 0 10px 0;
      color: #e94560;
      font-size: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
      font-size: 12px;
    }
    .legend-line {
      width: 30px;
      height: 2px;
      background: #e94560;
      margin-right: 10px;
    }
    .legend-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4ecdc4;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>全连接神经网络可视化</h1>
  <p class="subtitle">神经元用圆圈表示，连线粗细代表权重大小</p>
  
  <div id="visualization"></div>
  <div class="tooltip"></div>
  
  <div class="legend">
    <h3>图例</h3>
    <div class="legend-item">
      <div class="legend-circle"></div>
      <span>神经元节点</span>
    </div>
    <div class="legend-item">
      <div class="legend-line" style="height: 1px;"></div>
      <span>权重较小</span>
    </div>
    <div class="legend-item">
      <div class="legend-line" style="height: 4px;"></div>
      <span>权重较大</span>
    </div>
  </div>

  <script>
    const width = 900;
    const height = 600;
    const margin = { top: 80, right: 80, bottom: 80, left: 80 };
    
    const svg = d3.select("#visualization")
      .append("svg")
      .attr("width", width)
      .attr("height", height);
    
    const tooltip = d3.select(".tooltip");
    
    d3.json("network.json").then(data => {
      const layers = data.layers;
      const weights = data.weights;
      
      const layerSpacing = (width - margin.left - margin.right) / (layers.length - 1);
      
      const nodes = [];
      const links = [];
      
      layers.forEach((layer, layerIndex) => {
        const neuronCount = layer.neurons;
        const layerHeight = (height - margin.top - margin.bottom);
        const neuronSpacing = layerHeight / (neuronCount + 1);
        
        for (let i = 0; i < neuronCount; i++) {
          nodes.push({
            layer: layerIndex,
            layerName: layer.name,
            index: i,
            x: margin.left + layerIndex * layerSpacing,
            y: margin.top + (i + 1) * neuronSpacing,
            id: `${layerIndex}-${i}`
          });
        }
      });
      
      weights.forEach((layerWeights, layerIndex) => {
        layerWeights.forEach((neuronWeights, fromNeuron) => {
          neuronWeights.forEach((weight, toNeuron) => {
            links.push({
              source: `${layerIndex}-${fromNeuron}`,
              target: `${layerIndex + 1}-${toNeuron}`,
              weight: weight
            });
          });
        });
      });
      
      const weightScale = d3.scaleLinear()
        .domain([0, d3.max(links, d => Math.abs(d.weight))])
        .range([0.5, 6]);
      
      const colorScale = d3.scaleOrdinal()
        .domain(layers.map(l => l.name))
        .range(["#4ecdc4", "#45b7d1", "#96ceb4", "#ffeaa7"]);
      
      const linkGroup = svg.append("g").attr("class", "links");
      const nodeGroup = svg.append("g").attr("class", "nodes");
      
      const link = linkGroup.selectAll("line")
        .data(links)
        .enter()
        .append("line")
        .attr("class", "connection")
        .attr("x1", d => nodes.find(n => n.id === d.source).x)
        .attr("y1", d => nodes.find(n => n.id === d.source).y)
        .attr("x2", d => nodes.find(n => n.id === d.target).x)
        .attr("y2", d => nodes.find(n => n.id === d.target).y)
        .attr("stroke", "#e94560")
        .attr("stroke-width", d => weightScale(Math.abs(d.weight)))
        .attr("stroke-opacity", 0.6);
      
      link.on("mouseover", function(event, d) {
          d3.select(this)
            .attr("stroke-opacity", 1)
            .attr("stroke-width", weightScale(Math.abs(d.weight)) * 1.5);
          
          tooltip.style("opacity", 1)
            .html(`权重值: ${d.weight.toFixed(3)}`)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", function(event, d) {
          d3.select(this)
            .attr("stroke-opacity", 0.6)
            .attr("stroke-width", weightScale(Math.abs(d.weight)));
          
          tooltip.style("opacity", 0);
        });
      
      const node = nodeGroup.selectAll("g")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "neuron");
      
      node.append("circle")
        .attr("cx", d => d.x)
        .attr("cy", d => d.y)
        .attr("r", 20)
        .attr("fill", d => colorScale(d.layerName))
        .attr("stroke", "#fff")
        .attr("stroke-width", 2);
      
      node.append("text")
        .attr("class", "neuron-label")
        .attr("x", d => d.x)
        .attr("y", d => d.y + 4)
        .text(d => `n${d.index + 1}`);
      
      node.on("mouseover", function(event, d) {
          d3.select(this).select("circle")
            .attr("r", 25);
          
          tooltip.style("opacity", 1)
            .html(`层: ${d.layerName}<br>神经元: ${d.index + 1}`)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", function(event, d) {
          d3.select(this).select("circle")
            .attr("r", 20);
          
          tooltip.style("opacity", 0);
        });
      
      svg.selectAll(".layer-label")
        .data(layers)
        .enter()
        .append("text")
        .attr("class", "layer-label")
        .attr("x", (d, i) => margin.left + i * layerSpacing)
        .attr("y", margin.top / 2)
        .text(d => d.name);
    }).catch(error => {
      console.error("加载数据失败:", error);
      d3.select("#visualization")
        .append("p")
        .style("color", "red")
        .text("无法加载 network.json 文件，请确保通过本地服务器访问此页面。");
    });
  </script>
</body>
</html>
